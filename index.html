<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HASHU CREATIVE | Book a Service</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 14px;
      background: #0b0d14;
      color: #f5f5f7;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 560px;
      margin: 30px auto;
      padding: 26px;
      background: #171a25;
      border: 1px solid #303445;
      border-radius: 18px;
    }

    h1 { color: #f5c76a; margin-top: 0; }
    p { color: #c2c5d1; line-height: 1.6; }

    label {
      display: block;
      margin: 17px 0 7px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #3b4053;
      border-radius: 9px;
      background: #0e111b;
      color: white;
      font: inherit;
    }

    textarea { min-height: 110px; resize: vertical; }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      background: #f5c76a;
      color: #17130b;
      border: 0;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #ffda8a; }

    .note { font-size: 13px; }
    a { color: #f5c76a; }
  </style>
</head>

<body>
  <main class="container">
    <h1>HASHU CREATIVE</h1>
    <p>Creative designs. Personal service. Let's build something great.</p>

    <h2>Book a Service</h2>

    <form id="bookingForm">
      <label for="name">Your name</label>
      <input id="name" name="name" maxlength="80"
             autocomplete="name" required>

      <label for="phone">Phone number</label>
      <input id="phone" name="phone" type="tel"
             maxlength="25" autocomplete="tel"
             placeholder="Enter your phone number"
             pattern="[0-9+() -]{7,25}" required>

      <label for="service">Choose a service</label>
      <select id="service" name="service" required>
        <option value="">Select a service</option>
        <option>YouTube Thumbnail</option>
        <option>Gaming Graphics</option>
        <option>Social Media Poster</option>
        <option>Event Poster</option>
        <option>Invitation Design</option>
        <option>Logo Design</option>
        <option>Video Editing</option>
        <option>Custom Design</option>
      </select>

      <label for="details">Project details</label>
      <textarea id="details" name="details" maxlength="1500"
        placeholder="Describe what you need, your preferred style and deadline"
        required></textarea>

      <button type="submit">Continue to WhatsApp</button>
      <p class="note" id="message" aria-live="polite"></p>
    </form>
  </main>

  <script>
    // Replace this with your business WhatsApp number.
    const BUSINESS_WHATSAPP = "919876543210";

    document.getElementById("bookingForm")
      .addEventListener("submit", function (event) {
        event.preventDefault();

        if (!this.reportValidity()) return;

        const form = new FormData(this);
        const name = form.get("name").trim();
        const phone = form.get("phone").trim();
        const service = form.get("service");
        const details = form.get("details").trim();

        const booking =
          "HASHU CREATIVE - NEW BOOKING ENQUIRY\n\n" +
          "Customer: " + name + "\n" +
          "Phone: " + phone + "\n" +
          "Service: " + service + "\n" +
          "Project details: " + details + "\n\n" +
          "Please confirm availability and price.";

        const url = "https://wa.me/" + BUSINESS_WHATSAPP +
          "?text=" + encodeURIComponent(booking);

        document.getElementById("message").textContent =
          "WhatsApp will open. Send the message to submit your enquiry.";

        window.open(url, "_blank", "noopener");
      });
  </script>
</body>
</html>
